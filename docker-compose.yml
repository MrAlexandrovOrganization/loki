networks:
  loki-net:
    external: true
    name: loki-net

services:
  loki:
    container_name: "${CONTAINER_NAME_PREFIX:-}loki"
    image: grafana/loki:${LOKI_VERSION:?Run via make}
    restart: unless-stopped
    command:
      - '--config.file=/etc/loki/local-config.yaml'
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - loki-net
    extends:
      file: docker-compose.base.yml
      service: base
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

volumes:
  loki_data:
    name: observability_loki_data
